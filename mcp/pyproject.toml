[project]
name = "ziliaoshi"
version = "3.1.0-dev"
description = "一个专门为 Agent 提供专业知识的 MCP，可以自己打造这资料库。"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.12,<5",
  "pyyaml>=6",
  "markitdown>=0.1.7",
]

[project.scripts]
# 保留原命令名：本机已装的 exe 就是它，改名会让现有客户端配置失效
knowledge-mcp = "knowledge_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["knowledge_mcp*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
